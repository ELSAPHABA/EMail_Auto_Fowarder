name: Deploy Python App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # main 브랜치에 push되면 배포를 수행합니다.
    runs-on: ubuntu-latest

    steps:
      # 검증 단계에서 사용할 저장소 파일을 가져옵니다.
      - name: Check out repository
        uses: actions/checkout@v4

      # 프로젝트 실행 버전에 맞는 Python을 설정합니다.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 배포 전에 패키지 설치가 정상 동작하는지 확인합니다.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      # CI 환경에서 Docker 이미지가 정상 빌드되는지 확인합니다.
      - name: Build Docker image
        run: docker build -t email-auto-forwarder .

      # 대상 서버에 접속해 컨테이너를 다시 배포합니다.
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # 원격 서버의 배포 경로와 컨테이너 이름입니다.
            APP_DIR=/home/elsaphaba/HongDev/EMail_Auto_Fowarder
            CONTAINER_NAME=email-auto-forwarder
            IMAGE_NAME=email-auto-forwarder

            # 서버에 있는 저장소 코드를 최신 상태로 갱신합니다.
            cd "$APP_DIR"
            git pull origin main
            mkdir -p data

            # GitHub Secrets 값으로 실행용 .env 파일을 다시 생성합니다.
            cat > .env <<EOF
            NAVER_ID=${{ secrets.NAVER_ID }}
            NAVER_APP_PASSWORD=${{ secrets.NAVER_APP_PASSWORD }}
            FORWARD_TO=${{ secrets.FORWARD_TO }}
            TARGET_SENDERS=${{ secrets.TARGET_SENDERS }}
            IMAP_HOST=imap.naver.com
            SMTP_HOST=smtp.naver.com
            SMTP_PORT=465
            STATE_FILE=data/forwarded_uids.json
            IDLE_TIMEOUT=540
            EOF

            # 상태 파일을 유지하면서 컨테이너를 다시 빌드하고 재시작합니다.
            docker build -t "$IMAGE_NAME" .
            docker rm -f "$CONTAINER_NAME" || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file .env \
              -v "$APP_DIR/data:/app/data" \
              "$IMAGE_NAME"
